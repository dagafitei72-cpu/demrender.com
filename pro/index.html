<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plans — DemRender</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/assets/site.css?v=10">
  <style>
    .done { min-height: 100vh; display: grid; place-items: center; padding: 40px var(--gutter); text-align: center; }
    .done-card { max-width: 560px; padding: 44px 36px; border-radius: 24px; border: 1px solid var(--line-2); background: var(--panel); position: relative; }
    .done-card.free { display: block; }
    .done-card img { width: 84px; height: auto; margin-bottom: 18px; }
    .done-card h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.02em; }
    .done-card p { color: var(--text-2); margin: 0 0 12px; }
    .done-card .cta { justify-content: center; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="done">
    <div class="done-card free">
      <img src="/assets/img/logo-mark.png" alt="DemRender">
      <h1>Nothing was <span class="grad">charged.</span></h1>
      <p>You left the payment page, so nothing changed. Free keeps working as before.</p><p>You can choose a plan anytime in DemRender — <b>Your account → Plan</b>. If you already have one, this is also where its portal brings you back.</p>
      <div class="cta">
        <a class="btn btn-primary" href="/">DemRender home</a>
        <a class="btn btn-ghost" href="mailto:contact@demrender.com">contact@demrender.com</a>
      </div>
    </div>
  </main>
</body>
</html>
